name: Feature idea
description: Suggest something that would make Stillroom better for you.
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Stillroom to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How would you use it?
      description: What you're working on, and how this would help. Examples of other apps that do it well are welcome.
